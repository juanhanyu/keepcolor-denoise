<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>KeepColor</title></head><body><main><small>KEEP COLOR · 离线图像去噪</small><h1>干净，保留本色。</h1><p>图片留在设备上，原尺寸处理。</p><label class="pick">选择图片<input id="file" type="file" accept="image/png,image/jpeg,image/webp"></label><label>去噪强度 <output id="strength">10</output><input id="sigma" type="range" min="1" max="50" value="10"></label><button id="run" disabled>开始去噪</button><button id="compare" disabled>按住查看原图</button><button id="save" disabled>导出 PNG</button><p id="status" role="status">请选择一张图片</p><canvas id="preview"></canvas></main><script type="module" src="/src/main.js"></script></body></html>

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-and-metadata:
    name: Python syntax & JSON checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          python -m py_compile denoise.py server.py setup_env.py launcher/make_icon.py skills/keepcolor-denoise/scripts/denoise.py mobile/tools/export_model.py

      - name: Validate JSON files
        run: |
          python -c "import json, pathlib; [json.loads(p.read_text('utf-8')) for p in [pathlib.Path('plugin.json'), pathlib.Path('mobile/package.json'), pathlib.Path('mobile/capacitor.config.json')]]"

  launcher-build:
    name: Windows launcher build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Denoise.exe from launcher/Denoise.cs
        shell: cmd
        run: launcher\build.cmd

      - name: Verify Denoise.exe artifact
        shell: pwsh
        run: |
          if (-not (Test-Path "Denoise.exe")) { throw "Denoise.exe was not generated." }
          $item = Get-Item "Denoise.exe"
          Write-Host "Built $($item.Name): $($item.Length) bytes"
          if ($item.Length -lt 4096) { throw "Denoise.exe is unexpectedly small." }

  mobile-test:
    name: Mobile unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies & run tests
        run: |
          npm ci
          npm test
